<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Conta - Organizador Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }</style>
</head>
<body>
<div class="bg-white p-4 rounded-4 shadow-sm text-center" style="width: 100%; max-width: 450px;">
    
    <i class="bi bi-clock-history text-warning" style="font-size: 60px;"></i>
    <h4 class="fw-bold mt-3">Conta em Processo de Exclusão</h4>
    
    <p class="text-muted mt-3 mb-4 text-start">
        O seu perfil foi finalizado e está agendado para ser apagado permanentemente em <strong>{{ data_limite }}</strong>.
        <br><br>
        Como o prazo de 30 dias ainda não terminou, você tem a opção de cancelar este processo agora mesmo e voltar a usar a sua conta com todos os seus dados intactos.
    </p>

    <form action="/recuperar_conta" method="POST" class="d-grid gap-3">
        <button type="submit" name="acao" value="restaurar" class="btn btn-success fw-bold p-2">
            <i class="bi bi-arrow-counterclockwise"></i> Sim, quero cancelar a exclusão
        </button>
        
        <button type="submit" name="acao" value="manter_exclusao" class="btn btn-outline-secondary fw-bold p-2">
            Não, continuar com a exclusão
        </button>
    </form>
    
</div>
</body>
</html>
