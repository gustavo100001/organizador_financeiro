{% extends 'base.html' %}
{% block content %}
<div class="px-3">
    <h4 class="fw-bold mb-4"><a href="/perfil" class="text-decoration-none text-dark"><i class="bi bi-arrow-left me-2"></i></a> Configurações</h4>

    <form action="/configuracoes" method="POST" class="dashboard-card p-4">
        <h6 class="fw-bold mb-3"><i class="bi bi-palette"></i> Tema do Sistema</h6>
        <select name="tema" class="form-select mb-4">
            <option value="light" {% if usuario_global.tema == 'light' %}selected{% endif %}>Claro (Padrão)</option>
            <option value="dark" {% if usuario_global.tema == 'dark' %}selected{% endif %}>Escuro (Dark Mode)</option>
            <option value="pink" {% if usuario_global.tema == 'pink' %}selected{% endif %}>Rosa (Com Corações 💕)</option>
        </select>

        <h6 class="fw-bold mb-3"><i class="bi bi-keyboard"></i> Digitação de Valores</h6>
        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" role="switch" id="pixSwitch" name="input_pix" {% if usuario_global.input_pix %}checked{% endif %}>
            <label class="form-check-label text-muted small" for="pixSwitch">Estilo App de Banco (Digita os centavos primeiro, igual ao Pix)</label>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Aplicar Configurações</button>
    </form>
</div>
{% endblock %}
