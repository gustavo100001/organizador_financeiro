<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - Organizador Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }</style>
</head>
<body>
<div class="bg-white p-4 rounded-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
        <i class="bi bi-wallet2 text-success fs-1"></i>
        <h4 class="fw-bold mt-2">Criar Conta</h4>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="alert alert-{{ messages[0][0] }} py-2" style="font-size: 14px;">{{ messages[0][1] }}</div>{% endif %}
    {% endwith %}

    <form action="/cadastro" method="POST">
        <div class="mb-3">
            <label class="form-label small text-muted">Nome </label>
            <input type="text" name="nome" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label small text-muted">E-mail</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label small text-muted">Telefone (Celular com DDD)</label>
            <input type="text" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
        </div>
        <div class="mb-4">
            <label class="form-label small text-muted">Crie uma Senha (Mínimo 6 caracteres)</label>
            <input type="password" name="senha" class="form-control" minlength="6" placeholder="Sua senha" title="A senha deve ter no mínimo 6 caracteres" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold">Criar Minha Conta</button>
    </form>
    <div class="text-center mt-3"><a href="/login" class="text-decoration-none small">Já tem conta? Faça Login</a></div>
</div>
</body>
</html>
