{% extends 'base.html' %}
{% block content %}
<div class="px-3">
    <h4 class="fw-bold mb-4"><a href="/perfil" class="text-decoration-none text-dark"><i class="bi bi-arrow-left me-2"></i></a> Editar Perfil</h4>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="alert alert-{{ messages[0][0] }} py-2">{{ messages[0][1] }}</div>{% endif %}
    {% endwith %}

    <form action="/perfil/editar" method="POST" class="dashboard-card p-4">
        <label class="form-label small text-muted">Nome</label>
        <input type="text" name="nome" class="form-control mb-3" value="{{ user.nome }}" required>
        
        <label class="form-label small text-muted">E-mail</label>
        <input type="email" name="email" class="form-control mb-3" value="{{ user.email }}" required>
        
        <hr class="my-4">
        <h6 class="fw-bold">Alterar Senha (Opcional)</h6>
        <label class="form-label small text-muted mt-2">Nova Senha</label>
        <input type="password" name="nova_senha" class="form-control mb-3" placeholder="Deixe em branco para não alterar">
        
        <hr class="my-4">
        <h6 class="fw-bold text-danger">Confirmação Necessária</h6>
        <label class="form-label small text-muted mt-2">Digite sua senha atual para salvar alterações</label>
        <input type="password" name="senha_atual" class="form-control mb-4" required>
        
        <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar Alterações</button>
    </form>
</div>
{% endblock %}
